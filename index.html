<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Surprise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    .font-serif-title { font-family: 'Playfair Display', serif; }
    .font-handwriting { font-family: 'Dancing Script', cursive; }
    .glass {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }
    .petal {
      position: fixed;
      bottom: -10px;
      font-size: 20px;
      animation: float 8s linear infinite;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-rose-200 min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

  <!-- Floating Petals Background -->
  <div id="petals-container"></div>

  <!-- Main Card -->
  <div class="glass max-w-md w-full rounded-3xl p-6 shadow-2xl text-center space-y-6 z-10 my-8">
    
    <h1 class="text-4xl font-serif-title text-rose-800 tracking-wide font-semibold">
      A Little Surprise For You 🌸
    </h1>

    <!-- Photo Container -->
    <div class="relative group mx-auto w-64 h-64 rounded-2xl overflow-hidden shadow-md border-4 border-white/60">
      <!-- Direct path to photo.jpg uploaded in the repo -->
      <img src="photo.jpg" alt="Memory Photo" class="w-full h-full object-cover rounded-xl transition duration-500 transform group-hover:scale-105">
    </div>

    <!-- Interactive Lily Bouquet -->
    <div class="space-y-3">
      <p class="text-xs uppercase tracking-widest text-rose-700 font-semibold">Tap a lily to reveal a message 🌸</p>
      <div class="flex justify-center gap-4 text-4xl cursor-pointer">
        <span onclick="showMessage(1)" class="hover:scale-125 transition transform">🪷</span>
        <span onclick="showMessage(2)" class="hover:scale-125 transition transform">🌺</span>
        <span onclick="showMessage(3)" class="hover:scale-125 transition transform">🌸</span>
      </div>
      <div id="message-box" class="min-h-[60px] text-rose-900 font-handwriting text-2xl p-3 bg-white/40 rounded-xl shadow-inner flex items-center justify-center">
        Click a flower above! ✨
      </div>
    </div>

    <!-- Audio Player -->
    <div class="bg-white/50 rounded-2xl p-4 shadow-sm space-y-3">
      <p class="text-sm font-medium text-rose-800">Playing: Darkhaast 🎵</p>
      <!-- Direct path to song.mp3 uploaded in the repo -->
      <audio id="bg-audio" src="song.mp3" loop></audio>
      
      <button onclick="toggleAudio()" id="play-btn" class="bg-rose-500 hover:bg-rose-600 text-white font-semibold px-6 py-2 rounded-full shadow-lg transition transform active:scale-95 text-sm">
        ▶ Play Song
      </button>
    </div>

  </div>

  <script>
    const messages = {
      1: "You bring so much brightness and warmth into my life! 🌟",
      2: "Thank you for always being my safest place and sweetest memory! 💖",
      3: "Here is to a lifetime of laughter, late night chats, and endless adventures! 🥂"
    };

    function showMessage(id) {
      const box = document.getElementById('message-box');
      box.innerText = messages[id];
    }

    function toggleAudio() {
      const audio = document.getElementById('bg-audio');
      const btn = document.getElementById('play-btn');
      if (audio.paused) {
        audio.play();
        btn.innerText = "⏸ Pause Song";
      } else {
        audio.pause();
        btn.innerText = "▶ Play Song";
      }
    }

    // Floating Petals Animation
    function createPetals() {
      const container = document.getElementById('petals-container');
      const petalIcons = ['🌸', '✨', '💖', '🪷'];
      for (let i = 0; i < 15; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.innerText = petalIcons[Math.floor(Math.random() * petalIcons.length)];
        petal.style.left = Math.random() * 100 + 'vw';
        petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
        petal.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(petal);
      }
    }
    createPetals();
  </script>
</body>
</html>
